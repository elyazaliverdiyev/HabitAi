<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitAI — Вход</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            opacity: 0.8;
            margin-bottom: 24px;
            font-size: 15px;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-bottom: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-google {
            background: #fff;
            color: #333;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .btn-open {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #000;
            box-shadow: 0 8px 24px rgba(34, 197, 94, 0.4);
            font-size: 18px;
        }

        .success {
            color: #4ade80;
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 16px;
        }

        .error {
            color: #f87171;
            font-size: 13px;
            margin: 12px 0;
        }

        .hint {
            font-size: 12px;
            opacity: 0.6;
            line-height: 1.5;
            margin-top: 12px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 16px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #step1,
        #step2,
        #loading {
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>✅ HabitAI</h1>
        <p class="subtitle">Авторизация для входа в приложение</p>

        <!-- Step 1: Sign in button -->
        <div id="step1">
            <p style="margin-bottom:20px; opacity:0.9;">Нажмите кнопку для входа:</p>
            <button class="btn btn-google" onclick="doSignIn()">
                <svg style="vertical-align:middle;margin-right:8px" width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Войти с Google
            </button>
            <div id="authError" class="error" style="display:none"></div>
        </div>

        <!-- Step 2: Open app button -->
        <div id="step2">
            <div class="success" id="successText">✅ Вход выполнен!</div>
            <a id="openLink" class="btn btn-open" href="#">🚀 Открыть HabitAI</a>
            <p class="hint">Нажмите кнопку. Если Windows спросит — выберите "Открыть".</p>
        </div>

        <!-- Loading state -->
        <div id="loading">
            <div class="spinner"></div>
            <p id="loadingText" style="opacity:0.7">Подготовка токена...</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        var params = new URLSearchParams(window.location.search);
        var providerName = params.get('provider') || 'google';

        // Cloud Function URL for generating custom tokens
        var FUNCTION_URL = 'https://us-central1-habitai-90e1e.cloudfunctions.net/generateCustomToken';

        firebase.initializeApp({
            apiKey: "AIzaSyA0W3B7LgAUaLG9DrSRdCQvkn4F8EpvlwY",
            authDomain: "habitai-90e1e.firebaseapp.com",
            projectId: "habitai-90e1e",
            storageBucket: "habitai-90e1e.firebasestorage.app",
            messagingSenderId: "176216214870",
            appId: "1:176216214870:web:329824d6e68dafbc79daf7"
        });
        var auth = firebase.auth();

        // Show step 1 when ready
        document.getElementById('step1').style.display = 'block';

        function doSignIn() {
            var authProvider;
            if (providerName === 'google') {
                authProvider = new firebase.auth.GoogleAuthProvider();
            } else if (providerName === 'twitter') {
                authProvider = new firebase.auth.TwitterAuthProvider();
            } else if (providerName === 'apple') {
                authProvider = new firebase.auth.OAuthProvider('apple.com');
                authProvider.addScope('email');
                authProvider.addScope('name');
            }

            document.getElementById('authError').style.display = 'none';

            // signInWithPopup — user clicked button so popup won't be blocked
            auth.signInWithPopup(authProvider).then(function (result) {
                // Sign-in succeeded! Now get ID token and exchange for custom token
                document.getElementById('step1').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loadingText').textContent = 'Подготовка токена...';

                return result.user.getIdToken(true).then(function (idToken) {
                    return { user: result.user, idToken: idToken };
                });

            }).then(function (data) {
                // Call Cloud Function to get custom token
                return fetch(FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: data.idToken })
                }).then(function (response) {
                    if (!response.ok) throw new Error('Cloud Function error: ' + response.status);
                    return response.json();
                }).then(function (result) {
                    return { user: data.user, customToken: result.customToken };
                });

            }).then(function (data) {
                // Build deep link URL with custom token
                var deepLinkUrl = 'habitai://auth-callback?customToken=' + encodeURIComponent(data.customToken);

                // Show step 2 — open app button
                document.getElementById('loading').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('successText').innerHTML =
                    '✅ Вход выполнен как<br>' + (data.user.email || data.user.displayName);
                document.getElementById('openLink').href = deepLinkUrl;

            }).catch(function (error) {
                console.error('Auth error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('step1').style.display = 'block';
                var errorEl = document.getElementById('authError');
                errorEl.style.display = 'block';
                if (error.code === 'auth/popup-blocked') {
                    errorEl.innerHTML = 'Popup заблокирован. Отключите блокировщик popup и попробуйте снова.';
                } else if (error.code === 'auth/popup-closed-by-user') {
                    errorEl.innerHTML = 'Окно было закрыто. Нажмите кнопку снова.';
                } else {
                    errorEl.innerHTML = 'Ошибка: ' + error.message + '<br><br>Попробуйте снова.';
                }
            });
        }
    </script>
</body>

</html>
